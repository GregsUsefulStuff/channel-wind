name: Monthly history top-up and weight refit

on:
  schedule:
    - cron: "0 10 1 * *"   # 10am UTC on the 1st of each month
  workflow_dispatch: {}      # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Top up history cache (only fetches what's new or missing)
        run: python -u scripts/build_history.py

      - name: Refit blend weights from the cache
        run: python -u scripts/fit_weights.py

      - name: Commit updated data
        if: always()   # save history progress even if the refit step refuses a bad fit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history data/model_weights.json
          git commit -m "Monthly history top-up and weight refit" || echo "No changes to commit"
          git push
