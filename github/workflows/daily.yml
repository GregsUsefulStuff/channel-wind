name: Daily wind prediction

on:
  schedule:
    - cron: "0 13 * * *"   # 1pm UTC = ~6am Pacific (adjust for DST if it matters to you)
  workflow_dispatch: {}      # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily prediction
        run: python scripts/daily_predict.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/predictions_log.jsonl
          git commit -m "Daily prediction update" || echo "No changes to commit"
          git push
